<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Painel — Forge Agenda</title>
</head>
<body>
  <main class="container py-4" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <a href="index.html">Início</a>
      <button type="button" class="btn btn-outline-secondary btn-sm" id="sair">Sair</button>
    </div>

    <h1 class="h3">Painel</h1>
    <p>Olá, <strong id="nomeUsuario"></strong></p>
    <div class="alert alert-light border">
      <div class="small text-secondary mb-1">Link para clientes agendarem</div>
      <a id="linkCliente" href="#"></a>
    </div>

    <section class="card mb-4">
      <div class="card-body">
        <h2 class="h5">Serviços</h2>
        <form id="formServico" class="row g-2 align-items-end">
          <input type="hidden" name="editId" value="">
          <div class="col-md-4">
            <label class="form-label">Nome</label>
            <input class="form-control" name="name" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Duração (min)</label>
            <input class="form-control" name="durationMinutes" type="number" min="5" step="5" value="30" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Preço (opcional)</label>
            <input class="form-control" name="price" type="number" min="0" step="0.01">
          </div>
          <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100" id="btnServico">Salvar</button>
          </div>
        </form>
        <p id="erroServico" class="text-danger mt-2 mb-0"></p>
        <ul id="listaServicos" class="list-group list-group-flush mt-3"></ul>
      </div>
    </section>

    <section class="card mb-4">
      <div class="card-body">
        <h2 class="h5">Disponibilidade</h2>
        <form id="formDisponibilidade" class="row g-2 align-items-end">
          <div class="col-md-4">
            <label class="form-label">Dia da semana</label>
            <select class="form-select" name="weekday" required>
              <option value="1">Segunda</option>
              <option value="2">Terça</option>
              <option value="3">Quarta</option>
              <option value="4">Quinta</option>
              <option value="5">Sexta</option>
              <option value="6">Sábado</option>
              <option value="0">Domingo</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Início</label>
            <input class="form-control" name="start" type="time" value="09:00" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Fim</label>
            <input class="form-control" name="end" type="time" value="18:00" required>
          </div>
          <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Adicionar</button>
          </div>
        </form>
        <p id="erroDisponibilidade" class="text-danger mt-2 mb-0"></p>
        <ul id="listaDisponibilidade" class="list-group list-group-flush mt-3"></ul>
      </div>
    </section>

    <section class="card mb-4">
      <div class="card-body">
        <h2 class="h5">Agenda</h2>
        <div class="mb-3">
          <label class="form-label" for="filtroData">Filtrar por data (vazio = a partir de hoje)</label>
          <input class="form-control" type="date" id="filtroData">
        </div>
        <ul id="listaAgenda" class="list-group list-group-flush"></ul>
      </div>
    </section>

    <div id="boxRemarcar" class="card mb-4" hidden>
      <div class="card-body">
        <h3 class="h5">Remarcar</h3>
        <p id="remarcarInfo"></p>
        <form id="formRemarcar" class="row g-2 align-items-end">
          <input type="hidden" id="remarcarId">
          <div class="col-md-4">
            <label class="form-label">Nova data</label>
            <input class="form-control" type="date" id="remarcarData" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Horário livre</label>
            <select class="form-select" id="remarcarSlot" required></select>
          </div>
          <div class="col-md-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Confirmar</button>
            <button type="button" class="btn btn-outline-secondary" id="fecharRemarcar">Fechar</button>
          </div>
        </form>
        <p id="erroRemarcar" class="text-danger mt-2 mb-0"></p>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/slots.js"></script>
  <script src="js/painel.js"></script>
</body>
</html>
