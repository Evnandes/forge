<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel — Forge Agenda</title>
</head>
<body>
  <p>
    <a href="index.html">Início</a> |
    <button type="button" id="sair">Sair</button>
  </p>
  <h1>Painel</h1>
  <p>Olá, <span id="nomeUsuario"></span></p>
  <p>
    Link para clientes agendarem:<br>
    <a id="linkCliente" href="#"></a>
  </p>

  <hr>
  <h2>Serviços</h2>
  <form id="formServico">
    <input type="hidden" name="editId" value="">
    <p>
      <label>Nome<br>
        <input name="name" required>
      </label>
    </p>
    <p>
      <label>Duração (minutos)<br>
        <input name="durationMinutes" type="number" min="5" step="5" value="30" required>
      </label>
    </p>
    <p>
      <label>Preço (opcional)<br>
        <input name="price" type="number" min="0" step="0.01">
      </label>
    </p>
    <button type="submit" id="btnServico">Salvar serviço</button>
  </form>
  <p id="erroServico" style="color: red;"></p>
  <ul id="listaServicos"></ul>

  <hr>
  <h2>Disponibilidade</h2>
  <form id="formDisponibilidade">
    <p>
      <label>Dia da semana<br>
        <select name="weekday" required>
          <option value="1">Segunda</option>
          <option value="2">Terça</option>
          <option value="3">Quarta</option>
          <option value="4">Quinta</option>
          <option value="5">Sexta</option>
          <option value="6">Sábado</option>
          <option value="0">Domingo</option>
        </select>
      </label>
    </p>
    <p>
      <label>Início<br>
        <input name="start" type="time" value="09:00" required>
      </label>
    </p>
    <p>
      <label>Fim<br>
        <input name="end" type="time" value="18:00" required>
      </label>
    </p>
    <button type="submit">Adicionar horário</button>
  </form>
  <p id="erroDisponibilidade" style="color: red;"></p>
  <ul id="listaDisponibilidade"></ul>

  <hr>
  <h2>Agenda</h2>
  <p>
    <label>Filtrar por data (vazio = a partir de hoje)<br>
      <input type="date" id="filtroData">
    </label>
  </p>
  <ul id="listaAgenda"></ul>

  <div id="boxRemarcar" hidden>
    <h3>Remarcar</h3>
    <p id="remarcarInfo"></p>
    <form id="formRemarcar">
      <input type="hidden" id="remarcarId">
      <p>
        <label>Nova data<br>
          <input type="date" id="remarcarData" required>
        </label>
      </p>
      <p>
        <label>Horário livre<br>
          <select id="remarcarSlot" required></select>
        </label>
      </p>
      <button type="submit">Confirmar remarcação</button>
      <button type="button" id="fecharRemarcar">Fechar</button>
    </form>
    <p id="erroRemarcar" style="color: red;"></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/slots.js"></script>
  <script src="js/painel.js"></script>
</body>
</html>
