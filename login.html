<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Forge Agenda</title>
</head>
<body>
  <p><a href="index.html">Início</a></p>
  <h1>Entrar</h1>
  <p>Use sua conta Google. Sem senha do site e sem e-mail de confirmação.</p>
  <p>
    <button type="button" id="btnGoogle">Continuar com Google</button>
  </p>
  <p id="erro" style="color: red;"></p>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async () => {
      if (!ensureConfigOrWarn()) return;
      await redirectIfLogged();
      await bindGoogleLogin("btnGoogle", "erro");
    })();
  </script>
</body>
</html>
