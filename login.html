<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Entrar — Forge Agenda</title>
</head>
<body>
  <main class="container py-4" style="max-width: 520px;">
    <p><a href="index.html">Início</a></p>
    <h1 class="h3 mb-3">Entrar</h1>
    <p class="text-secondary">Use sua conta Google. Sem senha do site e sem e-mail de confirmação.</p>
    <button type="button" class="btn btn-primary" id="btnGoogle">Continuar com Google</button>
    <p id="erro" class="text-danger mt-3 mb-0"></p>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js?v=20261113f"></script>
  <script src="js/logic.js?v=20261113f"></script>
  <script src="js/ui.js?v=20261113f"></script>
  <script src="js/db.js?v=20261113f"></script>
  <script src="js/auth.js?v=20261113f"></script>
  <script>
    (async () => {
      if (!ensureConfigOrWarn()) return;
      await redirectIfLogged();
      await bindGoogleLogin("btnGoogle", "erro");
    })();
  </script>
</body>
</html>
