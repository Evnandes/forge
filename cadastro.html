<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Forge Agenda</title>
</head>
<body>
  <p><a href="index.html">Início</a></p>
  <h1>Criar conta</h1>
  <form id="form">
    <p>
      <label>Nome<br>
        <input name="name" required>
      </label>
    </p>
    <p>
      <label>E-mail<br>
        <input name="email" type="email" required>
      </label>
    </p>
    <p>
      <label>Senha (mínimo 6 caracteres)<br>
        <input name="password" type="password" required minlength="6">
      </label>
    </p>
    <button type="submit">Cadastrar</button>
  </form>
  <p id="erro" style="color: red;"></p>
  <p id="ok" style="color: green;"></p>
  <p>Já tem conta? <a href="login.html">Entrar</a></p>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async () => {
      if (!ensureConfigOrWarn()) return;
      await redirectIfLogged();
      document.getElementById("form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const erro = document.getElementById("erro");
        const ok = document.getElementById("ok");
        erro.textContent = "";
        ok.textContent = "";
        const form = event.target;
        const email = form.email.value;
        const password = form.password.value;
        try {
          await dbCreateUser({
            name: form.name.value,
            email,
            password
          });
          try {
            await dbSignIn({ email, password });
            window.location.href = "painel.html";
          } catch (e2) {
            form.reset();
            ok.innerHTML =
              "Conta criada. Abra seu e-mail (<strong>" + email + "</strong>), " +
              "clique no link de confirmação do Supabase e depois volte em " +
              "<a href=\"login.html\">Entrar</a>.";
          }
        } catch (e) {
          erro.textContent = e.message;
        }
      });
    })();
  </script>
</body>
</html>
