<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forge Agenda</title>
</head>
<body>
  <h1>Forge Agenda</h1>
  <p>Agenda simples para quem atende com hora marcada. Sem planilha. Sem WhatsApp confuso.</p>
  <p>Você cadastra serviços e horários. Seu cliente marca. Você acompanha o dia.</p>
  <ul>
    <li><a href="login.html">Entrar com Google</a></li>
    <li><a href="agendar.html">Quero agendar um horário</a></li>
  </ul>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async () => {
      if (!ensureConfigOrWarn()) return;
      try {
        const user = await dbGetSessionUser();
        if (user) {
          document.body.insertAdjacentHTML(
            "beforeend",
            '<p><a href="painel.html">Ir para o painel</a></p>'
          );
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
