<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Forge Agenda</title>
</head>
<body>
  <main class="container py-4" style="max-width: 720px;">
    <h1 class="h3 mb-3">Forge Agenda</h1>
    <p class="text-secondary">Agenda simples para quem atende com hora marcada. Sem planilha. Sem WhatsApp confuso.</p>
    <p>Você cadastra serviços e horários. Seu cliente marca. Você acompanha o dia.</p>
    <div class="d-grid gap-2 col-md-6">
      <a class="btn btn-primary" href="login.html">Entrar com Google</a>
      <a class="btn btn-outline-secondary" href="agendar.html">Quero agendar um horário</a>
    </div>
    <div id="areaLogado" class="mt-3"></div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async () => {
      if (!ensureConfigOrWarn()) return;
      try {
        const user = await dbGetSessionUser();
        if (user) {
          document.getElementById("areaLogado").innerHTML =
            '<a class="btn btn-success" href="painel.html">Ir para o painel</a>';
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
