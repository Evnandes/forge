<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar — Forge Agenda</title>
</head>
<body>
  <p><a href="index.html">Início</a></p>
  <h1>Agendar horário</h1>
  <form id="form">
    <p>
      <label>Profissional<br>
        <select id="profissional" required></select>
      </label>
    </p>
    <p>
      <label>Serviço<br>
        <select id="servico" required></select>
      </label>
    </p>
    <p>
      <label>Data<br>
        <input type="date" id="data" required>
      </label>
    </p>
    <p>
      <label>Horário<br>
        <select id="horario" required></select>
      </label>
    </p>
    <p>
      <label>Seu nome<br>
        <input id="cliente" required>
      </label>
    </p>
    <button type="submit">Confirmar agendamento</button>
  </form>
  <p id="erro" style="color: red;"></p>
  <p id="ok" style="color: green;"></p>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/slots.js"></script>
  <script src="js/agendar.js"></script>
</body>
</html>
